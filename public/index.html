<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream TV - Configurazione Rapida</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #00e676; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; margin-top: 20px; background: #00e676; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; }
        #msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Invia a TV</h2>
        <form id="remoteForm">
            <label>Codice PIN TV</label>
            <input type="text" id="code" placeholder="Es. 123456" required readonly>

            <label>URL Server Xtream</label>
            <input type="url" id="server" placeholder="http://esempio.com:8080" required>

            <label>Username</label>
            <input type="text" id="username" placeholder="Inserisci username" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Inserisci password" required>

            <button type="submit">INVIA ALLA TV</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        // Autocompila il codice PIN se presente nell'URL
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
            document.getElementById('code').value = params.get('code');
        } else {
            document.getElementById('code').removeAttribute('readonly');
        }

        document.getElementById('remoteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.innerText = "Invio in corso...";
            
            const res = await fetch('/api/session/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code: document.getElementById('code').value,
                    server: document.getElementById('server').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (res.ok) {
                msg.style.color = "#00e676";
                msg.innerText = " Dati inviati con successo alla TV!";
            } else {
                msg.style.color = "#ff5252";
                msg.innerText = " Errore o codice PIN errato/scaduto.";
            }
        });
    </script>
</body>
</html>
